name: V2 integration Pilot immutable release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-integration-pilot-release
  cancel-in-progress: false

env:
  APPROVED_SHA: 51878a26ef46595468e2309a9d1e4eb8a7c8a74f
  PRODUCT_SHA: 6022ce0df595570198d9c148c8178a76eab32211
  HARDENING_SHA: 51878a26ef46595468e2309a9d1e4eb8a7c8a74f
  RELEASE_TAG: 51878a26ef46595468e2309a9d1e4eb8a7c8a74f-business-ratings-checkpoint-v2

jobs:
  images:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            dockerfile: src/CreatorPay.Api/Dockerfile
          - component: web
            dockerfile: src/CreatorPay.Web/Dockerfile
    steps:
      - name: Check out the mirrored approved source object
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.APPROVED_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$APPROVED_SHA" = "$HARDENING_SHA"
          git merge-base --is-ancestor "$PRODUCT_SHA" "$APPROVED_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build approved linux/amd64 runtime image
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          IMAGE="ghcr.io/hamiki4/creatorpay-v2-integration-${COMPONENT}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing immutable release tag." >&2
            exit 1
          fi
          args=()
          if [ "$COMPONENT" = web ]; then
            args+=(--build-arg VITE_API_URL=/)
          fi
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            --file "source/${DOCKERFILE}" \
            --label "org.opencontainers.image.revision=${APPROVED_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/hamiki4/CreatorPayV2" \
            --label "org.opencontainers.image.title=CreatorPayV2 V3 integration Pilot ${COMPONENT}" \
            --tag "$IMAGE" \
            "${args[@]}" \
            source

      - name: Scan release image before publishing
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          version: v0.74.0
          image-ref: ghcr.io/hamiki4/creatorpay-v2-integration-${{ matrix.component }}:${{ env.RELEASE_TAG }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ matrix.component }}-security.json

      - name: Publish and record runnable registry digest
        run: |
          IMAGE="ghcr.io/hamiki4/creatorpay-v2-integration-${COMPONENT}:${RELEASE_TAG}"
          docker push "$IMAGE"
          mkdir -p release
          docker image inspect "$IMAGE" --format '{{json .}}' | python3 -c '
          import json, os, pathlib, sys
          data = json.load(sys.stdin)
          image = os.environ["IMAGE"]
          component = os.environ["COMPONENT"]
          prefix = image.split(":")[0] + "@"
          digest = next(x for x in data["RepoDigests"] if x.startswith(prefix))
          record = {
              "component": component,
              "commit": os.environ["APPROVED_SHA"],
              "productCommit": os.environ["PRODUCT_SHA"],
              "runtimeHardeningCommit": os.environ["HARDENING_SHA"],
              "image": image,
              "digest": digest,
              "imageId": data["Id"],
              "platform": "linux/amd64",
              "scan": "passed",
              "apiOrigin": "same-origin",
              "productionDeployment": False,
          }
          (pathlib.Path("release") / (component + "-image.json")).write_text(json.dumps(record, indent=2) + "\n")'
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/hamiki4/creatorpay-v2-integration-${{ matrix.component }}:${{ env.RELEASE_TAG }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-integration-pilot-${{ matrix.component }}-promotions-ugc-v1
          path: |
            release/${{ matrix.component }}-image.json
            ${{ matrix.component }}-security.json
          retention-days: 30
